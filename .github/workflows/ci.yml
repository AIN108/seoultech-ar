name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # ubuntu-latest에는 Android SDK가 설치되어 있다(ANDROID_HOME). AGP 8.6은 JDK 17 이상이 필요하다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run JVM unit tests
        # 저장소의 gradlew는 실행 권한 없이(100644) 커밋되어 있어 bash로 실행한다
        run: bash ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore
